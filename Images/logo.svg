      <stop offset="0.35" stop-color="#ffb8a8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff8f7a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="9" dy="7" stdDeviation="3" flood-color="#3b2a2a" flood-opacity="0.65"/>
    </filter>
    <filter id="soft2" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="globe"><ellipse cx="505" cy="472" rx="495" ry="462"/></clipPath>
  </defs>

  <g clip-path="url(#globe)">
    <ellipse cx="505" cy="472" rx="495" ry="462" fill="url(#bg)"/>
    <ellipse cx="505" cy="472" rx="495" ry="462" fill="url(#rim)"/>
  </g>

  <!-- blades -->
  <defs>
    <path id="r1" d="M425,95 C420,200 385,340 290,480 C220,580 140,650 98,668 C86,684 112,704 150,698 C245,660 345,545 395,435 C418,350 421,230 428,150 Z"/>
    <path id="r2" d="M427,98 C440,240 490,360 548,470 C610,585 670,655 722,676 C738,690 728,708 700,703 C610,660 525,545 490,450 C462,372 432,262 424,160 Z"/>
    <path id="o1" d="M565,122 C552,240 520,350 445,455 C375,555 290,665 240,692 C226,712 248,736 280,730 C362,688 456,590 512,485 C545,410 558,300 569,190 Z"/>
    <path id="o2" d="M565,122 C585,230 650,360 715,475 C770,570 815,655 868,702 C882,718 862,738 830,733 C765,712 685,610 630,505 C595,425 575,300 560,190 Z"/>
  </defs>
  <g filter="url(#soft2)" fill="#3d2c2c" fill-opacity="0.7" transform="translate(8,6)">
