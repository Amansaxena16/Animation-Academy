<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 948" width="2024" height="1896">
  <defs>
    <radialGradient id="bg" cx="0.68" cy="0.31" r="0.62" fx="0.68" fy="0.31">
      <stop offset="0" stop-color="#17b2dc"/>
      <stop offset="0.3" stop-color="#1a8fd0"/>
      <stop offset="0.62" stop-color="#2557b2"/>
      <stop offset="1" stop-color="#2b3490"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.82" stop-color="#1b2470" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b2470" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="red" gradientUnits="userSpaceOnUse" x1="200" y1="700" x2="430" y2="100">
      <stop offset="0" stop-color="#e8302c"/>
      <stop offset="1" stop-color="#ee4a34"/>
    </linearGradient>
    <linearGradient id="redR" gradientUnits="userSpaceOnUse" x1="430" y1="100" x2="710" y2="700">
      <stop offset="0" stop-color="#ee4a34"/>
      <stop offset="1" stop-color="#e8302c"/>
    </linearGradient>
    <linearGradient id="or" gradientUnits="userSpaceOnUse" x1="250" y1="720" x2="565" y2="120">
      <stop offset="0" stop-color="#f08a26"/>
      <stop offset="1" stop-color="#f6a23c"/>
    </linearGradient>
    <linearGradient id="orR" gradientUnits="userSpaceOnUse" x1="565" y1="120" x2="850" y2="720">
      <stop offset="0" stop-color="#f6a23c"/>
      <stop offset="1" stop-color="#f08a26"/>
    </linearGradient>
    <linearGradient id="sw" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="990" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.25" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow">
