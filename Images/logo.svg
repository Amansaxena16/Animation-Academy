  </g>
  <use href="#r1" fill="url(#red)"/>
  <use href="#r2" fill="url(#redR)"/>
  <g filter="url(#soft2)" fill="#3d2c2c" fill-opacity="0.75" transform="translate(8,6)">
    <use href="#o1"/><use href="#o2"/>
  </g>
  <use href="#o1" fill="url(#or)"/>
  <use href="#o2" fill="url(#orR)"/>

  <!-- globe swoosh -->
  <g clip-path="url(#globe)">
    <path d="M18,392 C90,470 200,525 330,545 C450,562 560,552 680,510 C800,468 900,400 990,280" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="16" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M18,392 C90,470 200,525 330,545 C450,562 560,552 680,510 C800,468 900,400 990,280" fill="none" stroke="url(#sw)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- star flare -->
  <circle cx="562" cy="530" r="85" fill="url(#glow)"/>
  <path d="M562,468 L570,522 L648,531 L570,540 L566,610 L562,700 L558,610 L554,540 L488,531 L554,522 Z" fill="#fff"/>
  <path d="M562,495 L566,526 L600,531 L566,536 L562,575 L558,536 L524,531 L558,526 Z" fill="#fff" transform="rotate(45 562 531)" opacity="0.9"/>
  <circle cx="562" cy="531" r="7" fill="#fff"/>
</svg>
