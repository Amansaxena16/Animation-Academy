# Render Blueprint: the website, the API and its Postgres database, all on Render's free plans.
# In Render: New → Blueprint → pick this repo. Step-by-step in DEPLOY.md.
# Values marked `sync: false` are asked for when the Blueprint is created.
#
# Free plan limits: services sleep after 15 minutes idle (the next visit waits ~1 minute), and
# the free database is deleted after 30 days. Before real students use the site, switch every
# `plan: free` to a paid plan (DEPLOY.md, "Moving to paid plans").

databases:
  - name: aa-db
    databaseName: animation_academy
    user: aa_user
    plan: free
    region: singapore # closest Render region to Kanpur
    postgresMajorVersion: "16"

services:
  - type: web
    name: animation-academy-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass # deploy main only after GitHub CI passes
    buildFilter:
      paths: ["backend/**"]
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: aa-db, property: connectionString }
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: REVALIDATE_SECRET # shared with the website below
        generateValue: true
      - key: WEB_CONCURRENCY # one worker fits the free instance's memory
        value: "1"
      - key: PUBLIC_SITE_URL # printed on certificates as the verification link
        value: https://animation-academy.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://animation-academy.onrender.com,https://animation-academy-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://animation-academy.onrender.com
      - key: FRONTEND_REVALIDATE_URL
        value: https://animation-academy.onrender.com/api/revalidate
      # The office's admin login, created on the first start only. Remove the password
      # from Render once you've logged in.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: animation-academy
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /robots.txt
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["frontend/**"]
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The browser calls /api/v1 on this site, which passes it on to the API (next.config.ts).
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: API_INTERNAL_URL
        value: https://animation-academy-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_SITE_URL
        value: https://animation-academy.onrender.com
      - key: REVALIDATE_SECRET
        fromService:
          { type: web, name: animation-academy-api, envVarKey: REVALIDATE_SECRET }
