# Render Blueprint: the whole site as one free web service, plus its free Postgres database.
# In Render: New → Blueprint → pick this repo. Step-by-step in DEPLOY.md.
#
# Why one service: on the free plan a sleeping service is woken by visitors, but not by another
# Render service. With the website and the API in separate services, the website could not wake
# the API. The root Dockerfile runs both (Next.js on $PORT, Django behind it on 127.0.0.1:8000).
#
# Free plan limits: the service sleeps after 15 minutes idle (the next visit waits ~1 minute),
# and the free database is deleted after 30 days. Before real students use the site, switch to
# paid plans (DEPLOY.md, "Moving to paid plans").

databases:
  - name: aa-db
    databaseName: animation_academy
    user: aa_user
    plan: free
    region: singapore # closest Render region to Kanpur
    postgresMajorVersion: "16"

services:
  - type: web
    name: animation-academy
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass # deploy main only after GitHub CI passes
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: aa-db, property: connectionString }
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: REVALIDATE_SECRET # shared by both apps in the container
        generateValue: true
      - key: WEB_CONCURRENCY # one Django worker fits the free instance's memory
        value: "1"
      # The public address. NEXT_PUBLIC_SITE_URL is also a Docker build argument.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://animation-academy.onrender.com
      - key: PUBLIC_SITE_URL # printed on certificates as the verification link
        value: https://animation-academy.onrender.com
      - key: CSRF_TRUSTED_ORIGINS # for the Django admin at /django-admin/
        value: https://animation-academy.onrender.com
      - key: FRONTEND_REVALIDATE_URL # Django tells the website (same container) to refresh
        value: http://127.0.0.1:10000/api/revalidate
      # The office's admin login, created on the first start only (skipped if an admin exists).
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
